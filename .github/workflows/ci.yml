name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, Worker, web and database tests
        run: npm test
      - name: n8n workflows are valid and up to date
        run: npx tsx n8n/src/build.ts --check
      - name: Build web app
        run: npm run build -w @applypilot/web
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_API_URL: https://applypilot-api.example.workers.dev
      - name: Bundle Worker (dry run)
        run: npm run build -w @applypilot/api

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: runner
      - name: Playwright runner against the demo application site
        run: npm run test:e2e -w @applypilot/runner
